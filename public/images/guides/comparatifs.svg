<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgc)"/>

  <!-- air fryer left -->
  <g transform="translate(180,120)">
    <rect x="-70" y="0" width="140" height="170" rx="20" fill="#1e293b"/>
    <rect x="-70" y="0" width="140" height="40" rx="20" fill="#334155"/>
    <circle cx="45" cy="20" r="10" fill="#f97316"/>
    <rect x="-55" y="60" width="110" height="95" rx="10" fill="#475569"/>
    <rect x="-45" y="70" width="90" height="75" rx="8" fill="#64748b"/>
  </g>

  <!-- air fryer right -->
  <g transform="translate(620,120)">
    <rect x="-70" y="0" width="140" height="170" rx="20" fill="#1e293b"/>
    <rect x="-70" y="0" width="140" height="40" rx="20" fill="#334155"/>
    <circle cx="45" cy="20" r="10" fill="#f97316"/>
    <rect x="-55" y="60" width="110" height="95" rx="10" fill="#475569"/>
    <rect x="-45" y="70" width="90" height="75" rx="8" fill="#64748b"/>
  </g>

  <!-- VS badge -->
  <circle cx="400" cy="220" r="55" fill="#f97316"/>
  <text x="400" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff">VS</text>

  <!-- connecting dashed line -->
  <line x1="255" y1="220" x2="345" y2="220" stroke="#fb923c" stroke-width="4" stroke-dasharray="8 8"/>
  <line x1="455" y1="220" x2="545" y2="220" stroke="#fb923c" stroke-width="4" stroke-dasharray="8 8"/>
</svg>
